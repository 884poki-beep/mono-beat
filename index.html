<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080808"><title>一瞬の重さ feat. 知声 · MONO BEAT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(100%,560px);padding:18px 14px 24px}.brand{letter-spacing:.3em;font-weight:900;font-size:28px}.sub{color:#999;font-size:11px;letter-spacing:.22em;margin-top:2px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pill{border:1px solid #555;border-radius:20px;padding:6px 10px;font-size:11px;color:#ddd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#141414;border:1px solid #292929;padding:10px;border-radius:10px;text-align:center}.label{font-size:10px;letter-spacing:.12em;color:#888}.value{font-size:21px;font-weight:800;margin-top:3px}#arena{height:min(62vh,620px);min-height:350px;position:relative;overflow:hidden;background:#050608 url("humans-error-art.png") center 36%/cover no-repeat;border:1px solid #8c929b;border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);touch-action:manipulation;box-shadow:0 0 28px #dce7ff20,inset 0 0 80px #000b}.lane{position:relative;border-right:1px solid #dce7ff55;background:linear-gradient(90deg,#02040a55,#02040a20,#02040a55)}.lane:last-child{border:0}.lane:nth-child(2){background:linear-gradient(90deg,#02040a45,#02040a12,#02040a45),linear-gradient(90deg,transparent,#eaf3ff99 50%,transparent);background-size:100% 100%,1px 100%;background-repeat:no-repeat;background-position:center}.hitline{position:absolute;left:0;right:0;bottom:66px;height:3px;background:#f5f8ff;box-shadow:0 0 18px #fff,0 0 34px #9dbfff}.note{position:absolute;left:13%;width:74%;height:17px;border-radius:5px;background:linear-gradient(180deg,#fff,#dce9ff);box-shadow:0 0 14px #fff,0 0 24px #9ec5ff;border:1px solid #fff}.key{position:absolute;bottom:15px;left:12%;width:76%;height:42px;border:1px solid #d8e4ff;border-radius:5px;display:grid;place-items:center;color:#f4f7ff;font-weight:800;font-size:12px;background:#05070b99;box-shadow:0 0 10px #dce7ff55}.key.active{background:#fff;color:#000;box-shadow:0 0 20px #fff}.overlay{position:absolute;inset:0;background:linear-gradient(#03050bd9,#03050bb8);backdrop-filter:blur(1px);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay h1{font-size:28px;letter-spacing:.16em;margin:0 0 8px}.overlay p{font-size:13px;color:#aaa;line-height:1.7;max-width:320px}.btn{background:#fff;color:#000;border:0;border-radius:999px;padding:13px 24px;font-size:14px;font-weight:900;margin-top:12px;cursor:pointer}.btn:disabled{opacity:.4}.small{font-size:10px!important;color:#666!important}.judge{position:absolute;z-index:4;top:34%;width:100%;text-align:center;font-weight:900;font-size:22px;letter-spacing:.15em;text-shadow:0 2px 8px #000;pointer-events:none}.progress{height:4px;background:#252525;margin:12px 2px 7px;border-radius:5px;overflow:hidden}.bar{height:100%;width:0;background:#fff}.song{display:flex;justify-content:space-between;color:#888;font-size:11px}.footer{color:#555;text-align:center;font-size:10px;letter-spacing:.1em;margin-top:18px}#loadmsg{color:#bbb;font-size:12px;margin-top:10px}
</style></head><body><main class="app"><header class="top"><div><div class="brand" style="letter-spacing:.08em;font-size:24px">一瞬の重さ</div><div class="sub">feat. 知声 · MONO BEAT</div></div><span class="pill">3 LANE / 01</span></header>
<div class="stats"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">000000</div></div><div class="stat"><div class="label">COMBO</div><div class="value" id="combo">0</div></div><div class="stat"><div class="label">BEST</div><div class="value" id="best">0</div></div></div>
<div id="arena"><div class="lane" data-lane="0"><div class="key">←</div></div><div class="lane" data-lane="1"><div class="key">↓</div></div><div class="lane" data-lane="2"><div class="key">→</div></div><div class="hitline"></div><div class="judge" id="judge"></div><div class="overlay" id="overlay"><h1 style="letter-spacing:.04em">一瞬の重さ</h1><p>feat. 知声<br>「一瞬の重さ」<br>音楽のリズムに合わせて、白いノーツをタップ！<br>左・中央・右の3レーンでプレイ。判定は英語音声で読み上げます。</p><button class="btn" id="start" disabled>音楽を解析中…</button><div id="loadmsg">音源を読み込んでいます</div><p class="small">イヤホン推奨 ・ 画面をタップしてもプレイできます</p></div></div>
<div class="progress"><div class="bar" id="bar"></div></div><div class="song"><span>一瞬の重さ feat. 知声</span><span id="time">00:00 / --:--</span></div><div class="footer">NOT PERFECT. JUST HUMAN. · FIND YOUR RHYTHM</div><audio id="audio" src="Humans error ver.mp3" preload="auto"></audio></main>
<script>
const audio=document.getElementById('audio'), overlay=document.getElementById('overlay'), startBtn=document.getElementById('start'), loadmsg=document.getElementById('loadmsg');let chart=[],notes=[],playing=false,score=0,combo=0,best=Number(localStorage.getItem('monobeat-best')||0),lastJudge=0,raf=0;
document.getElementById('best').textContent=best;
const fmt=t=>{if(!isFinite(t))return '00:00';return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')};
function setLoad(s){loadmsg.textContent=s}
async function analyze(){try{const r=await fetch('Humans error ver.mp3');if(!r.ok)throw Error('音源ファイルが見つかりません');const buf=await r.arrayBuffer();const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const decoded=await ctx.decodeAudioData(buf);const data=decoded.getChannelData(0), sr=decoded.sampleRate, step=Math.floor(sr*.05), energy=[];for(let i=0;i<data.length;i+=step){let sum=0,n=Math.min(step,data.length-i);for(let j=0;j<n;j++)sum+=data[i+j]*data[i+j];energy.push(Math.sqrt(sum/n));}let smooth=energy.map((v,i)=>{let s=0,c=0;for(let j=Math.max(0,i-3);j<=Math.min(energy.length-1,i+3);j++){s+=energy[j];c++}return s/c});let avg=smooth.reduce((a,b)=>a+b,0)/smooth.length;let peaks=[];for(let i=4;i<smooth.length-4;i++){let local=smooth.slice(Math.max(0,i-12),Math.min(smooth.length,i+13)).reduce((a,b)=>a+b,0)/Math.min(25,smooth.length);if(smooth[i]>smooth[i-1]&&smooth[i]>=smooth[i+1]&&smooth[i]>Math.max(avg*.78,local*1.22)&&smooth[i]>.025)peaks.push({t:i*.05,v:smooth[i]});}let filtered=[];for(const p of peaks){if(p.t<.45)continue;let prev=filtered[filtered.length-1];if(!prev||p.t-prev.t>.28)filtered.push(p);else if(p.v>prev.v)filtered[filtered.length-1]=p;}const minNotes=Math.floor(decoded.duration*1.5);if(filtered.length<minNotes){filtered=[];let laneIndex=0;for(let t=.8;t<decoded.duration-.35;t+=.55,laneIndex++){filtered.push({t,v:1,lane:[0,1,2][Math.floor(Math.random()*3)]})}}// レーンを単純な規則で繰り返さず、曲ごとに安定した変化のあるパターンにする
let laneSeq=[],prev1=-1,prev2=-1;let seed=2166136261;for(let i=0;i<decoded.duration*10;i++){seed^=Math.floor((smooth[i]||0)*100000)+i;seed=Math.imul(seed,16777619);}
function nextLane(){let choices=[0,1,2].filter(l=>!(l===prev1&&l===prev2));let x=(seed>>>0)%choices.length;seed=(Math.imul(seed,1664525)+1013904223)>>>0;let l=choices[x];prev2=prev1;prev1=l;return l;}
chart=filtered.map((p,i)=>({t:p.t,l:p.lane!==undefined?p.lane:nextLane()}));audio.dataset.duration=decoded.duration;setLoad(chart.length+' ノーツを準備しました');startBtn.disabled=false;startBtn.textContent='PLAY';await ctx.close();}catch(e){setLoad('音源を読み込めません。index.htmlとMP3を同じフォルダに置いてください');startBtn.textContent='読み込み失敗';}}
function spawn(){notes=[];document.querySelectorAll('.note').forEach(n=>n.remove());chart.forEach((n,i)=>{let el=document.createElement('div');el.className='note';el.style.top='-24px';document.querySelectorAll('.lane')[n.l].appendChild(el);notes.push({...n,el,done:false})})}
function begin(){audio.currentTime=0;audio.play().then(()=>{playing=true;overlay.style.display='none';score=combo=0;document.getElementById('score').textContent='000000';document.getElementById('combo').textContent='0';spawn();tick()}).catch(()=>{overlay.style.display='flex';setLoad('再生できません。もう一度PLAYを押してください')})}
function tick(){if(!playing)return;const now=audio.currentTime,duration=Number(audio.dataset.duration)||audio.duration||1;for(const n of notes){if(n.done)continue;let delta=n.t-now;let y=(1-delta/1.65)*(document.getElementById('arena').clientHeight-95);n.el.style.top=y+'px';if(delta<-.19){n.done=true;n.el.remove();combo=0;document.getElementById('combo').textContent=combo;showJudge('MISS');}}
 document.getElementById('bar').style.width=Math.min(100,now/duration*100)+'%';document.getElementById('time').textContent=fmt(now)+' / '+fmt(duration);if(audio.ended||now>=duration-.03){finish();return}raf=requestAnimationFrame(tick)}
function speakJudge(s){
  if(!('speechSynthesis' in window)) return;
  // 連続判定で読み上げが詰まらないよう、前の発話を止めて最新の判定を読む
  window.speechSynthesis.cancel();
  const words={MISS:'Miss',GREAT:'Great',GOOD:'Good',PROFESSIONAL:'Professional'};
  const utterance=new SpeechSynthesisUtterance(words[s]||s);
  utterance.lang='en-US';
  utterance.rate=1.05;
  utterance.pitch=1;
  utterance.volume=0.9;
  window.speechSynthesis.speak(utterance);
}
function showJudge(s){const j=document.getElementById('judge');j.textContent=s;j.style.opacity='1';speakJudge(s);lastJudge=performance.now();setTimeout(()=>{if(performance.now()-lastJudge>=430)j.textContent=''},430)}
function hit(lane){if(!playing)return;document.querySelectorAll('.key')[lane].classList.add('active');setTimeout(()=>document.querySelectorAll('.key')[lane].classList.remove('active'),100);const now=audio.currentTime;let target=null,dist=.2;for(const n of notes){if(n.done||n.l!==lane)continue;const d=Math.abs(n.t-now);if(d<dist){target=n;dist=d}}if(!target){showJudge('MISS');combo=0;document.getElementById('combo').textContent=combo;return}target.done=true;target.el.remove();let pts=dist<.075?1000:dist<.14?600:300;score+=pts;combo++;best=Math.max(best,combo);localStorage.setItem('monobeat-best',best);document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('combo').textContent=combo;document.getElementById('best').textContent=best;showJudge(dist<.075?'PROFESSIONAL':dist<.14?'GREAT':'GOOD')}
function finish(){playing=false;cancelAnimationFrame(raf);audio.pause();overlay.style.display='flex';overlay.innerHTML=`<h1>RESULT</h1><p>YOUR SCORE</p><div style="font-size:40px;font-weight:900">${String(score).padStart(6,'0')}</div><p>BEST COMBO　${best}</p><button class="btn" id="again">もう一度プレイ</button><p class="small">MONO BEAT · THANKS FOR PLAYING</p>`;document.getElementById('again').onclick=()=>{overlay.innerHTML='<h1 style="letter-spacing:.04em">一瞬の重さ</h1><p>feat. 知声<br>「一瞬の重さ」<br>リズムに合わせてタップ！</p><button class="btn" id="start">PLAY</button>';document.getElementById('start').onclick=begin;}}
startBtn.onclick=begin;document.querySelectorAll('.lane').forEach((el,i)=>el.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)}));document.addEventListener('keydown',e=>{const m={'ArrowLeft':0,'ArrowDown':1,'ArrowRight':2,'a':0,'s':1,'d':2};if(m[e.key]!==undefined)hit(m[e.key])});audio.addEventListener('error',()=>setLoad('MP3が見つかりません。ファイルを同じフォルダに置いてください'));analyze();
</script></body></html>
